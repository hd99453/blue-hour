<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111a2c">
<title>Blue Hour · AI Chat</title>
<style>
:root{color-scheme:dark;--bg:#0c1424;--panel:#151f33;--panel2:#1b2941;--line:#2d3b56;--ink:#e8eef9;--muted:#9baac3;--blue:#9bb9ed;--lav:#b7a8e8;--user:#283b5c;--assistant:#1a2940}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#263858 0,transparent 42%),radial-gradient(ellipse at 100% 30%,#30294e 0,transparent 38%),var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:#202d45;border-radius:14px;padding:10px 14px}button:active{transform:scale(.98)}button.primary{background:linear-gradient(135deg,#718fc7,#897bb9);border:0;color:white;font-weight:650}button.ghost{background:transparent}.app{max-width:900px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:17px 2px 13px;border-bottom:1px solid #34415a88;gap:10px}.brand{display:flex;align-items:center;gap:11px}.orb{width:38px;height:38px;border-radius:14px;background:linear-gradient(145deg,#a9c8ed,#b9a9e9 60%,#e0c8dc);box-shadow:0 0 28px #9bb9ed44}.brand b{display:block;letter-spacing:.12em;font-size:13px}.brand small{color:var(--muted);font-size:11px;letter-spacing:.08em}.head-actions{display:flex;gap:7px}.head-actions button{padding:9px 11px}
.toolbar{display:flex;gap:8px;padding:12px 0;align-items:center}.toolbar select{min-width:0;flex:1;background:#17243a;border:1px solid var(--line);border-radius:12px;padding:10px}.status{font-size:11px;color:var(--muted);white-space:nowrap}
.chat{flex:1;display:flex;flex-direction:column;gap:15px;padding:15px 1px 20px;overflow:auto;min-height:45vh}.welcome{margin:auto;text-align:center;max-width:430px;padding:30px 12px;color:var(--muted)}.welcome .moon{font-size:35px;margin-bottom:12px}.welcome h1{color:var(--ink);font-size:24px;font-weight:550;margin:5px}.welcome p{font-size:13px}
.msg{max-width:88%;display:flex;flex-direction:column;gap:5px}.msg.user{align-self:flex-end}.msg.assistant{align-self:flex-start}.who{font-size:11px;color:var(--muted);padding:0 8px}.bubble{padding:12px 15px;border:1px solid #52658555;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:linear-gradient(145deg,#30496f,#293b5a);border-top-right-radius:6px}.assistant .bubble{background:linear-gradient(145deg,#1d2b43dd,#1b263bdd);border-top-left-radius:6px}.bubble.error{border-color:#a66b79;color:#ffd8df}
.composer{position:sticky;bottom:0;padding:10px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0c1424 15%)}.composebox{background:#17243a;border:1px solid #465673;border-radius:20px;padding:9px;box-shadow:0 12px 35px #0003}.composebox textarea{display:block;width:100%;resize:none;min-height:54px;max-height:160px;background:transparent;border:0;outline:0;padding:7px 8px}.composebottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.hint{font-size:10px;color:var(--muted);padding-left:7px}.composebottom button{padding:9px 17px}
.overlay{position:fixed;inset:0;background:#050a14bb;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.overlay.show{display:flex}.sheet{width:min(100%,560px);max-height:88vh;overflow:auto;background:#17243a;border:1px solid var(--line);border-radius:22px;padding:19px;box-shadow:0 20px 80px #0008}.sheet h2{font-size:18px;margin:0 0 15px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;background:#0f1a2c;border:1px solid var(--line);border-radius:12px;padding:11px;outline:none}.field textarea{min-height:90px;resize:vertical}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.note{font-size:11px;color:var(--muted);background:#101b2d;border-radius:12px;padding:11px;line-height:1.6}.sheet-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.history-list{display:flex;flex-direction:column;gap:8px}.history-item{display:flex;align-items:center;gap:8px}.history-item button:first-child{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-item .del{padding:10px}
@media(min-width:650px){.app{padding-left:24px;padding-right:24px}.chat{padding:24px 8px}.msg{max-width:76%}.overlay{align-items:center}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="orb"></div><div><b>BLUE HOUR</b><small>YOUR QUIET AI SPACE</small></div></div><div class="head-actions"><button class="ghost" id="historyBtn" aria-label="聊天记录">记录</button><button class="ghost" id="settingsBtn" aria-label="设置">设置</button></div></header>
<div class="toolbar"><select id="modelSelect" aria-label="模型"><option value="">先配置 API Key</option></select><span class="status" id="status">未连接</span><button id="newBtn" class="ghost">＋</button></div>
<main class="chat" id="chat"><div class="welcome"><div class="moon">☾</div><h1>留一点安静的时间</h1><p>在这里和你的 AI 慢慢聊天。配置 OpenRouter 后即可开始。</p></div></main>
<div class="composer"><div class="composebox"><textarea id="prompt" placeholder="写点什么……" rows="2"></textarea><div class="composebottom"><span class="hint">Enter 发送 · Shift + Enter 换行</span><button class="primary" id="sendBtn">发送 ↗</button></div></div></div>
</div>
<div class="overlay" id="settings"><section class="sheet"><h2>连接设置</h2><div class="note">API Key 只保存在当前浏览器的本地存储中，并由此页面直接发送给 OpenRouter。请只在自己的设备上使用，不要把这个网页公开分享，也不要把含有密钥的设备交给别人。</div><div class="field"><label>OpenRouter API Key</label><input id="apiKey" type="password" placeholder="sk-or-v1-..." autocomplete="off"></div><div class="field"><label>模型 ID</label><div class="row"><input id="modelInput" placeholder="例如 openai/gpt-4o-mini"><button id="loadModels">获取模型</button></div></div><div class="field"><label>系统设定</label><textarea id="systemPrompt" placeholder="例如：你是一个温柔、自然的聊天伙伴。"></textarea></div><div class="note" id="modelHelp">可以点击“获取模型”读取 OpenRouter 可用模型，也可以手动填写模型 ID。</div><div class="sheet-actions"><button class="ghost" data-close>取消</button><button class="primary" id="saveSettings">保存设置</button></div></section></div>
<div class="overlay" id="history"><section class="sheet"><h2>聊天记录</h2><div class="history-list" id="historyList"></div><div class="sheet-actions"><button data-close class="ghost">关闭</button></div></section></div>
<script>
const $=id=>document.getElementById(id);
const STORE='bluehour_v1';
let cfg=JSON.parse(localStorage.getItem(STORE+'_cfg')||'{}');
let chats=JSON.parse(localStorage.getItem(STORE+'_chats')||'[]');
let active=chats[0]?.id||null;
let messages=[];
const saveChats=()=>localStorage.setItem(STORE+'_chats',JSON.stringify(chats));
function newChat(){const c={id:Date.now().toString(),title:'新的对话',messages:[],updated:Date.now()};chats.unshift(c);active=c.id;messages=c.messages;saveChats();render();$('prompt').focus()}
function current(){return chats.find(c=>c.id===active)}
function render(){const el=$('chat');el.innerHTML='';if(!messages.length){el.innerHTML='<div class="welcome"><div class="moon">☾</div><h1>留一点安静的时间</h1><p>在这里和你的 AI 慢慢聊天。</p></div>';return}for(const m of messages){const wrap=document.createElement('div');wrap.className='msg '+(m.role==='user'?'user':'assistant');const who=document.createElement('div');who.className='who';who.textContent=m.role==='user'?'你':'AI';const bubble=document.createElement('div');bubble.className='bubble'+(m.error?' error':'');bubble.textContent=m.content;wrap.append(who,bubble);el.append(wrap)}el.scrollTop=el.scrollHeight}
function persist(){const c=current();if(c){c.messages=messages;c.updated=Date.now();if(c.title==='新的对话'&&messages[0])c.title=messages[0].content.slice(0,24);saveChats()}}
function open(id){$(id).classList.add('show')}function close(){document.querySelectorAll('.overlay').forEach(x=>x.classList.remove('show'))}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
$('settingsBtn').onclick=()=>{ $('apiKey').value=cfg.key||'';$('modelInput').value=cfg.model||'';$('systemPrompt').value=cfg.system||'你是一个温柔、自然、真诚的聊天伙伴。请用简洁口语化的语言交流。';open('settings')};
$('historyBtn').onclick=()=>{const list=$('historyList');list.innerHTML='';chats.forEach(c=>{const row=document.createElement('div');row.className='history-item';const b=document.createElement('button');b.textContent=c.title||'新的对话';b.onclick=()=>{active=c.id;messages=c.messages;close();render()};const d=document.createElement('button');d.className='del';d.textContent='删除';d.onclick=()=>{if(confirm('删除这条聊天记录？')){chats=chats.filter(x=>x.id!==c.id);if(active===c.id){active=chats[0]?.id||null;messages=chats[0]?.messages||[]}saveChats();$('historyBtn').click()}};row.append(b,d);list.append(row)});if(!chats.length)list.textContent='还没有聊天记录';open('history')};
$('newBtn').onclick=newChat;
$('saveSettings').onclick=()=>{cfg={key:$('apiKey').value.trim(),model:$('modelInput').value.trim(),system:$('systemPrompt').value.trim()};localStorage.setItem(STORE+'_cfg',JSON.stringify(cfg));updateModel();close();$('status').textContent=cfg.key?'已保存':'未连接'};
function updateModel(){const s=$('modelSelect');s.innerHTML='';const o=document.createElement('option');o.value=cfg.model||'';o.textContent=cfg.model||'请在设置中填写模型';s.append(o)}
$('loadModels').onclick=async()=>{const key=$('apiKey').value.trim();if(!key){$('modelHelp').textContent='请先填写 API Key';return} $('modelHelp').textContent='正在读取模型列表……';try{const r=await fetch('https://openrouter.ai/api/v1/models',{headers:{Authorization:'Bearer '+key}});if(!r.ok)throw Error('请求失败：'+r.status);const data=await r.json();const models=(data.data||[]).slice(0,500);$('modelHelp').innerHTML='已读取 '+models.length+' 个模型。选择后会填入模型 ID。';const sel=document.createElement('select');sel.style.cssText='width:100%;margin-top:8px;background:#0f1a2c;border:1px solid #2d3b56;border-radius:12px;padding:10px';sel.innerHTML='<option value="">选择模型……</option>';models.sort((a,b)=>(a.name||a.id).localeCompare(b.name||b.id)).forEach(m=>{const op=document.createElement('option');op.value=m.id;op.textContent=(m.name||m.id)+' · '+m.id;sel.append(op)});$('modelHelp').append(sel);sel.onchange=()=>{$('modelInput').value=sel.value}}catch(e){$('modelHelp').textContent='读取失败：'+e.message+'。也可以手动填写模型 ID。'}};
async function send(){const text=$('prompt').value.trim();if(!text)return;if(!cfg.key||!cfg.model){open('settings');$('status').textContent='需要配置';return}if(!active)newChat();messages.push({role:'user',content:text});$('prompt').value='';persist();render();$('sendBtn').disabled=true;$('status').textContent='思考中…';const pending={role:'assistant',content:'正在思考…'};messages.push(pending);render();try{const payload=[...(cfg.system?[{role:'system',content:cfg.system}]:[]),...messages.filter(m=>m!==pending).map(({role,content})=>({role,content}))];const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json','HTTP-Referer':location.href,'X-Title':'Blue Hour Private Chat'},body:JSON.stringify({model:cfg.model,messages:payload,stream:false})});const data=await r.json();if(!r.ok)throw Error(data.error?.message||'请求失败：'+r.status);pending.content=data.choices?.[0]?.message?.content||'模型没有返回文本。';}catch(e){pending.content='连接失败：'+e.message;pending.error=true}persist();render();$('sendBtn').disabled=false;$('status').textContent=pending.error?'连接异常':'已连接'}
$('sendBtn').onclick=send;$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
if(chats.length){messages=chats[0].messages;active=chats[0].id}updateModel();$('status').textContent=cfg.key?'已保存':'未连接';render();
</script>
</body></html>
